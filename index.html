<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Family Tree</title>
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <script src="/layout.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; background: #f5f5f5; }

    /* Landing screen */
    #landing { position: fixed; inset: 0; background: #f5f5f5; z-index: 200; display: flex; align-items: center; justify-content: center; }
    #landing.hidden { display: none; }
    .landing-card { background: #fff; border-radius: 12px; padding: 32px; width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); text-align: center; }
    .landing-card h1 { font-size: 24px; margin-bottom: 8px; }
    .landing-card p { color: #666; font-size: 14px; margin-bottom: 24px; }
    .landing-card input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 12px; }
    .landing-card button { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; margin-bottom: 8px; }
    .landing-card .btn-primary { background: #4a90d9; color: #fff; }
    .landing-card .btn-primary:hover { background: #3a7bc8; }
    .landing-card .btn-secondary { background: #eee; color: #333; }
    .landing-card .btn-secondary:hover { background: #ddd; }
    .landing-card .error { color: #e74c3c; font-size: 13px; margin-bottom: 8px; display: none; }
    .landing-card .divider { color: #999; font-size: 13px; margin: 16px 0; }

    /* Toolbar */
    #toolbar { position: fixed; top: 0; left: 0; right: 0; height: 48px; background: #fff; border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 16px; z-index: 10; gap: 8px; }
    #toolbar button { padding: 8px 16px; background: #4a90d9; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; white-space: nowrap; }
    .lbl-short { display: none; }
    #toolbar button:hover { background: #3a7bc8; }
    #toolbar .spacer { flex: 1; }
    #toolbar .tree-code { font-size: 13px; color: #666; margin-right: 8px; }
    #toolbar .tree-code span { font-weight: bold; color: #333; letter-spacing: 2px; cursor: pointer; }
    #toolbar .btn-small { padding: 6px 12px; font-size: 12px; background: #6c757d; }
    #toolbar .btn-small:hover { background: #5a6268; }
    .tooltip { position: fixed; background: #333; color: #fff; font-size: 12px; padding: 6px 12px; border-radius: 4px; pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity 0.2s, transform 0.2s; z-index: 1000; }
    .tooltip.show { opacity: 1; transform: translateY(0); }

    #cy { position: fixed; top: 48px; left: 0; right: 0; bottom: 0; }

    /* Detail card overlay */
    #detail-overlay { display: none; position: fixed; inset: 0; top: 48px; background: rgba(0,0,0,0.4); z-index: 50; justify-content: center; align-items: center; }
    #detail-overlay.open { display: flex; }
    #detail-card { background: #fff; border-radius: 12px; padding: 0; width: 380px; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
    .detail-photo { width: 100%; height: 200px; background: #e0e0e0; border-radius: 12px 12px 0 0; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .detail-photo img { width: 100%; height: 100%; object-fit: cover; }
    .detail-photo .placeholder { color: #999; font-size: 48px; }
    .detail-photo .photo-btn { position: absolute; bottom: 8px; right: 8px; padding: 6px 12px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .detail-photo .photo-btn:hover { background: rgba(0,0,0,0.8); }
    .detail-body { padding: 20px; }
    .detail-body .detail-section { margin-top: 12px; }
    .detail-body .detail-section label { font-size: 11px; text-transform: uppercase; color: #999; letter-spacing: 0.5px; }
    .detail-body .detail-section p { margin-top: 2px; font-size: 14px; color: #333; }
    .detail-body .detail-section .parent-link { color: #4a90d9; cursor: pointer; }
    .detail-body .detail-section .parent-link:hover { text-decoration: underline; }
    .detail-body .detail-section .rel-chip { display: inline-flex; align-items: center; gap: 2px; background: #f1f5f9; border-radius: 13px; padding: 3px 3px 3px 10px; margin: 4px 4px 0 0; }
    .detail-body .detail-section .rel-remove { border: none; background: none; color: #9aa5b1; cursor: pointer; font-size: 16px; line-height: 1; width: 20px; height: 20px; border-radius: 10px; padding: 0; }
    .detail-body .detail-section .rel-remove:hover { background: #e74c3c; color: #fff; }
    .detail-actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
    .detail-actions button { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .detail-actions .btn-parent { background: #2ecc71; color: #fff; }
    .detail-actions .btn-delete { background: #e74c3c; color: #fff; }
    .detail-actions .btn-close { background: #eee; color: #333; }
    .detail-actions .btn-hide { background: #95a5a6; color: #fff; }
    .detail-actions .btn-partner { background: #5dade2; color: #fff; }

    .detail-body input, .detail-body textarea { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; margin-top: 2px; }
    .detail-body textarea { resize: vertical; height: 60px; }

    /* Banner shown while picking someone straight off the graph */
    #parent-banner { display: none; position: fixed; top: 48px; left: 0; right: 0; height: 40px; background: #2ecc71; color: #fff; z-index: 20; text-align: center; line-height: 40px; font-size: 14px; }
    #parent-banner.open { display: block; }
    #parent-banner button { margin-left: 12px; padding: 4px 12px; background: rgba(255,255,255,0.3); color: #fff; border: 1px solid rgba(255,255,255,0.5); border-radius: 4px; cursor: pointer; font-size: 13px; }

    /* Bloodline banner */
    #bloodline-banner { display: none; position: fixed; top: 48px; left: 0; right: 0; height: 40px; background: #3498db; color: #fff; z-index: 20; text-align: center; line-height: 40px; font-size: 14px; }
    #bloodline-banner.open { display: block; }
    #bloodline-banner button { margin-left: 12px; padding: 4px 12px; background: rgba(255,255,255,0.3); color: #fff; border: 1px solid rgba(255,255,255,0.5); border-radius: 4px; cursor: pointer; font-size: 13px; }

    .photo-file-input { display: none; }

    /* ── Bottom sheets ──
       Anchored to the bottom edge, where a thumb actually reaches on a phone;
       a centred card once there is room for one. */
    .sheet-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 120; align-items: flex-end; justify-content: center; }
    .sheet-overlay.open { display: flex; }
    .sheet { background: #fff; width: 100%; max-width: 440px; border-radius: 18px 18px 0 0; padding: 6px 20px calc(20px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto; box-shadow: 0 -4px 32px rgba(0,0,0,0.2); }
    .sheet-grab { width: 36px; height: 4px; background: #d5d9de; border-radius: 2px; margin: 6px auto 14px; }
    .sheet h3 { font-size: 19px; margin-bottom: 3px; }
    .sheet .sheet-sub { color: #6b7280; font-size: 14px; line-height: 1.4; }
    .sheet .sheet-sub strong { color: #2c3e50; }
    .sheet-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #9aa5b1; margin: 16px 0 5px; }
    .sheet-label .opt { text-transform: none; letter-spacing: 0; color: #c2c9d1; }
    /* 16px keeps iOS from zooming the viewport when a field takes focus */
    .sheet input[type=text], .sheet input[type=search] { width: 100%; padding: 13px 14px; border: 1px solid #d5d9de; border-radius: 10px; font-size: 16px; background: #fff; -webkit-appearance: none; }
    .sheet input:focus { outline: none; border-color: #4a90d9; }
    .sheet-btns { display: flex; gap: 10px; margin-top: 20px; }
    .sheet-btns button { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; }
    .sheet-btns .btn-primary { background: #4a90d9; color: #fff; font-weight: 500; }
    .sheet-btns .btn-primary:disabled { background: #c9d6e3; cursor: default; }
    .sheet-btns .btn-cancel { background: #eef1f4; color: #33404d; }
    .sheet-switch { display: block; width: 100%; margin-top: 14px; padding: 12px; background: none; border: none; color: #4a90d9; font-size: 15px; cursor: pointer; }
    .sheet-error { display: none; margin-top: 14px; padding: 11px 13px; background: #fdecea; color: #b93d31; border-radius: 9px; font-size: 14px; line-height: 1.4; }
    .sheet-error.show { display: block; }
    .rel-clear { float: right; border: none; background: none; color: #7d94a8; font-size: 19px; line-height: 1; cursor: pointer; padding: 0 2px; }
    .rel-clear:hover { color: #b93d31; }
    .sheet-note { margin-top: 14px; padding: 11px 13px; background: #f1f6fb; color: #3d5a73; border-radius: 9px; font-size: 14px; line-height: 1.4; }
    .sheet-check { display: flex; align-items: center; gap: 11px; margin-top: 16px; padding: 13px; background: #f7fafc; border: 1px solid #e4eaf0; border-radius: 10px; cursor: pointer; font-size: 15px; }
    .sheet-check input { width: 20px; height: 20px; accent-color: #4a90d9; flex-shrink: 0; }

    /* Relative shortcuts on the detail card */
    .rel-add-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
    .rel-add-grid button { padding: 13px 8px; border: 1px solid #dbe3ea; background: #f7fafc; border-radius: 10px; font-size: 14px; cursor: pointer; color: #2c3e50; }
    .rel-add-grid button:hover:not(:disabled) { background: #eaf2fa; border-color: #a9c8e5; }
    .rel-add-grid button:disabled { color: #b8c1cb; background: #fafbfc; cursor: default; }

    /* Searchable person list */
    #relList { margin-top: 12px; max-height: 44vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .pick-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 6px; border: none; border-bottom: 1px solid #f0f2f5; background: none; cursor: pointer; text-align: left; font-size: 15px; color: #2c3e50; }
    .pick-row:hover { background: #f7fafc; }
    .pick-avatar { width: 38px; height: 38px; border-radius: 19px; background: #e6eaee; flex-shrink: 0; object-fit: cover; display: flex; align-items: center; justify-content: center; color: #96a1ac; font-size: 15px; }
    .pick-name { flex: 1; min-width: 0; }
    .pick-name span { display: block; color: #9aa5b1; font-size: 13px; }
    .pick-empty { padding: 26px 6px; text-align: center; color: #9aa5b1; font-size: 14px; }

    @media (min-width: 560px) {
      .sheet-overlay { align-items: center; }
      .sheet { border-radius: 14px; max-height: 84vh; padding-bottom: 20px; }
    }

    /* Mobile */
    @media (max-width: 480px) {
      .landing-card { width: calc(100% - 32px); padding: 24px; }
      #toolbar { padding: 0 8px; gap: 5px; }
      #toolbar button { padding: 7px 9px; font-size: 13px; }
      #toolbar .tree-code { font-size: 12px; margin-right: 2px; }
      #toolbar .btn-small { padding: 6px 9px; font-size: 12px; }
      .lbl-full { display: none; }
      .lbl-short { display: inline; }
      #detail-overlay { top: 0; align-items: stretch; }
      #detail-card { width: 100%; max-height: 100vh; border-radius: 0; }
      .detail-photo { height: 160px; border-radius: 0; }
      .detail-body { padding: 16px; }
      .detail-body textarea { height: 48px; }
    }
  </style>
</head>
<body>
  <!-- Landing Screen -->
  <div id="landing">
    <div class="landing-card">
      <h1>Family Tree</h1>
      <p>Create a new tree or join an existing one with a code.</p>
      <button class="btn-primary" onclick="createTree()">Create New Tree</button>
      <div class="divider">or join with a code</div>
      <input type="text" id="joinCode" placeholder="ABC123" maxlength="6">
      <div class="error" id="joinError">Tree not found. Check the code and try again.</div>
      <button class="btn-secondary" onclick="joinTree()">Join Tree</button>
    </div>
  </div>

  <!-- App -->
  <div id="toolbar">
    <button onclick="openAddSheet()"><span class="lbl-full">Add Person</span><span class="lbl-short">+ Add</span></button>
    <button id="bloodlineBtn" onclick="toggleBloodlineMode()"><span class="lbl-full">Show Bloodline</span><span class="lbl-short">Bloodline</span></button>
    <div class="spacer"></div>
    <div class="tree-code"><span class="lbl-full">Code: </span><span id="treeCodeDisplay" onclick="copyCode()"></span></div>
    <button class="btn-small" onclick="switchTree()"><span class="lbl-full">Switch Tree</span><span class="lbl-short">Switch</span></button>
  </div>

  <div id="parent-banner">
    <span id="graphPickText">Tap someone in the tree.</span>
    <button onclick="exitGraphPick()">Cancel</button>
  </div>

  <div id="bloodline-banner">
    <span id="bloodline-banner-text">Click a person to show their bloodline.</span>
    <button onclick="clearBloodlineMode()">Cancel</button>
  </div>

  <div id="cy"></div>

  <!-- Add / link a relative. One sheet, because from the user's side
       "who is her mother?" is the same thought whether that mother is
       already in the tree or not. -->
  <div id="rel-overlay" class="sheet-overlay" onclick="if(event.target===this)closeRelSheet()">
    <div class="sheet">
      <div class="sheet-grab"></div>
      <h3 id="relTitle">Add person</h3>
      <p class="sheet-sub" id="relSub"></p>

      <div id="relCreate">
        <label class="sheet-label" for="relName">Name</label>
        <input type="text" id="relName" placeholder="Full name" autocomplete="off" autocapitalize="words">
        <label class="sheet-label" for="relYear">Birth year <span class="opt">— optional</span></label>
        <input type="text" id="relYear" inputmode="numeric" placeholder="e.g. 1962" maxlength="4" autocomplete="off">
        <div id="relExtra"></div>
        <div class="sheet-error" id="relError"></div>
        <div class="sheet-btns">
          <button class="btn-cancel" onclick="closeRelSheet()">Cancel</button>
          <button class="btn-primary" id="relAddBtn" onclick="confirmRelAdd()">Add</button>
        </div>
        <button class="sheet-switch" id="relSwitchBtn" onclick="showRelPicker()">Choose someone already in the tree</button>
      </div>

      <div id="relPick" style="display:none">
        <input type="search" id="relSearch" placeholder="Search by name" autocomplete="off" oninput="renderRelPicker()">
        <div id="relList"></div>
        <div class="sheet-error" id="relPickError"></div>
        <div class="sheet-btns">
          <button class="btn-cancel" onclick="backFromPicker()">Back</button>
        </div>
        <button class="sheet-switch" onclick="pickFromGraph()">Tap someone in the tree instead</button>
      </div>
    </div>
  </div>

  <!-- Detail Card Overlay -->
  <div id="detail-overlay" onclick="if(event.target===this)saveAndCloseDetail()">
    <div id="detail-card">
      <div class="detail-photo" id="detailPhoto">
        <span class="placeholder" id="detailPhotoPlaceholder">?</span>
        <button class="photo-btn" id="detailPhotoBtn" onclick="document.getElementById('photoInput').click()">Add Photo</button>
      </div>
      <div class="detail-body">
        <input type="hidden" id="editId">
        <div class="detail-section">
          <label>Name</label>
          <input type="text" id="editName">
        </div>
        <div class="detail-section">
          <label>Birth Year</label>
          <input type="text" id="editBirthYear" placeholder="e.g. 1990">
        </div>
        <div class="detail-section" id="detailPartner"></div>
        <div class="detail-section" id="detailParents"></div>
        <div class="detail-section" id="detailChildren"></div>
        <div class="detail-section">
          <label id="relAddLabel">Add relative</label>
          <div class="rel-add-grid">
            <button onclick="openRelSheet('parent')" id="btnAddParent">+ Parent</button>
            <button onclick="openRelSheet('partner')" id="btnAddPartner">+ Partner</button>
            <button onclick="openRelSheet('child')">+ Child</button>
            <button onclick="openRelSheet('sibling')" id="btnAddSibling">+ Sibling</button>
          </div>
        </div>
        <div class="detail-section">
          <label>Notes</label>
          <textarea id="editNotes"></textarea>
        </div>
        <div class="detail-actions">
          <button class="btn-hide" id="btnHideChildren" onclick="toggleHideChildren()">Hide Children</button>
          <button class="btn-delete" onclick="deleteFromDetail()">Delete</button>
          <button class="btn-close" onclick="saveAndCloseDetail()">Close</button>
        </div>
      </div>
    </div>
  </div>
  <input type="file" id="photoInput" class="photo-file-input" accept="image/*" onchange="handlePhoto(event)">

  <script>
    // ── State ──
    const GEN_COLORS = [
      '#2ecc71', '#3498db', '#9b59b6', '#e67e22',
      '#e74c3c', '#1abc9c', '#f39c12', '#8e44ad',
    ];

    let currentTreeId = null;
    let currentTreeCode = null;
    let nextId = 1;
    let people = {};
    let selectedPersonId = null;
    let graphPick = null;   // { anchorId, relation } while picking from the graph
    let bloodlineMode = false;   // true when selecting or filtering
    let bloodlinePersonId = null; // person whose bloodline is shown
    let hiddenChildrenSet = new Set();
    let ws = null;

    // ── Landing / Tree management ──
    function showLanding() {
      document.getElementById('landing').classList.remove('hidden');
      document.getElementById('joinCode').value = '';
      document.getElementById('joinError').style.display = 'none';
    }

    function hideLanding() {
      document.getElementById('landing').classList.add('hidden');
    }

    async function createTree() {
      const res = await fetch('/api/trees', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({})
      });
      const tree = await res.json();
      enterTree(tree.id, tree.code);
    }

    async function joinTree() {
      const code = document.getElementById('joinCode').value.trim().toUpperCase();
      if (!code) return;
      const res = await fetch('/api/trees/join/' + code);
      if (!res.ok) {
        document.getElementById('joinError').style.display = 'block';
        return;
      }
      const tree = await res.json();
      enterTree(tree.id, tree.code);
    }

    function enterTree(treeId, treeCode) {
      currentTreeId = treeId;
      currentTreeCode = treeCode;
      people = {};
      nextId = 1;
      cy.elements().remove();

      document.getElementById('treeCodeDisplay').textContent = treeCode;
      localStorage.setItem('lastTreeId', treeId);
      localStorage.setItem('lastTreeCode', treeCode);
      history.replaceState({ treeId, treeCode }, '', '/tree/' + treeCode);
      hideLanding();
      connectWS();
      loadTreeData();
    }

    function switchTree() {
      if (ws) { ws.close(); ws = null; }
      currentTreeId = null;
      currentTreeCode = null;
      people = {};
      hiddenChildrenSet.clear();
      cy.elements().remove();
      history.replaceState(null, '', '/');
      showLanding();
    }

    function copyCode() {
      const el = document.getElementById('treeCodeDisplay');
      const shareUrl = location.origin + '/tree/' + currentTreeCode;
      navigator.clipboard.writeText(shareUrl).then(function() {
        const rect = el.getBoundingClientRect();
        const tip = document.createElement('div');
        tip.className = 'tooltip';
        tip.textContent = 'Link copied!';
        document.body.appendChild(tip);
        tip.style.left = (rect.left + rect.width / 2 - tip.offsetWidth / 2) + 'px';
        tip.style.top = (rect.bottom + 8) + 'px';
        requestAnimationFrame(function() { tip.classList.add('show'); });
        setTimeout(function() {
          tip.classList.remove('show');
          setTimeout(function() { tip.remove(); }, 200);
        }, 1200);
      }).catch(function() {});
    }

    async function loadTreeData() {
      const res = await fetch('/api/trees/' + currentTreeId + '/people');
      const data = await res.json();
      nextId = data.nextId;
      people = data.people;
      rebuildGraph();
    }

    // Enter key to join
    document.getElementById('joinCode').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') joinTree();
    });

    // ── Cytoscape setup ──
    var cy = cytoscape({
      container: document.getElementById('cy'),
      style: [
        { selector: 'node[type="person"]', style: {
          'label': 'data(label)',
          'text-valign': 'center',
          'text-halign': 'center',
          'background-color': 'data(color)',
          'background-image': 'data(photo)',
          'background-fit': 'cover',
          'background-opacity': 1,
          'color': '#fff',
          'font-size': '13px',
          'width': 'label',
          'height': 'label',
          'padding': '10px',
          'shape': 'round-rectangle',
          'text-wrap': 'wrap',
          'text-max-width': '120px',
        }},
        { selector: 'node[type="person"][?hasPhoto]', style: {
          'width': 60,
          'height': 60,
          'shape': 'ellipse',
          'text-valign': 'bottom',
          'text-margin-y': 8,
          'color': '#333',
          'font-weight': 'bold',
          'text-background-color': '#fff',
          'text-background-opacity': 0.7,
          'text-background-padding': '2px',
          'text-background-shape': 'round-rectangle',
        }},
        { selector: 'node[type="couple"]', style: {
          'width': 1, 'height': 1, 'background-opacity': 0, 'label': '',
        }},
        { selector: 'edge[etype="couple"]', style: {
          'width': 3, 'line-color': '#e74c3c', 'curve-style': 'straight',
        }},
        { selector: 'edge[etype="partner"]', style: {
          'width': 3, 'line-color': '#e74c3c', 'line-style': 'dashed', 'curve-style': 'straight',
        }},
        { selector: 'edge[etype="child"]', style: {
          'width': 2, 'line-color': '#999', 'curve-style': 'taxi',
          'taxi-direction': 'downward', 'taxi-turn': 'data(turn)', 'taxi-turn-min-distance': '4px',
        }},
        { selector: 'node:active', style: { 'overlay-opacity': 0.1 }},
        { selector: 'node.highlighted', style: {
          'border-width': 3, 'border-color': '#f1c40f',
        }},
      ],
      layout: { name: 'preset' },
      userZoomingEnabled: true,
      userPanningEnabled: true,
      boxSelectionEnabled: false,
    });

    cy.on('tap', 'node[type="person"]', function(evt) {
      const id = evt.target.id();
      if (graphPick) {
        graphPickTarget(id);
      } else if (bloodlineMode && !bloodlinePersonId) {
        applyBloodlineFilter(id);
      } else {
        openDetail(id);
      }
    });
    cy.on('tap', function(evt) {
      if (evt.target === cy) {
        if (graphPick) exitGraphPick();
        closeDetail();
      }
    });

    // ── Layout ──
    // Cytoscape only draws: FamilyLayout (layout.js) decides where everything
    // goes. Nodes are added first so the label-sized boxes can be measured,
    // then positioned in one batch.

    var measureCtx = document.createElement('canvas').getContext('2d');
    function labelWidth(text, font) {
      measureCtx.font = font;
      var widest = 0;
      text.split('\n').forEach(function (line) {
        widest = Math.max(widest, measureCtx.measureText(line).width);
      });
      return Math.min(120, widest);   // matches text-max-width in the stylesheet
    }

    function measureNodes(ids) {
      var size = {};
      ids.forEach(function (id) {
        var n = cy.getElementById(id);
        if (people[id].photo) {
          // the label hangs below a photo node, so it — not the circle — sets
          // how much room the person needs
          var label = people[id].birthYear ? people[id].name + '\n' + people[id].birthYear : people[id].name;
          size[id] = {
            w: Math.max(n.outerWidth(), labelWidth(label, 'bold 13px -apple-system, BlinkMacSystemFont, sans-serif') + 8),
            h: n.outerHeight() + 26,
          };
        } else {
          size[id] = { w: n.outerWidth(), h: n.outerHeight() };
        }
      });
      return size;
    }

    // ── Bloodline calculation ──
    function getBloodRelatives(personId) {
      const blood = new Set();
      // Step 1: collect all ancestors
      const ancestors = new Set();
      function addAncestors(id) {
        if (!id || ancestors.has(id) || !people[id]) return;
        ancestors.add(id);
        addAncestors(people[id].parent1);
        addAncestors(people[id].parent2);
      }
      addAncestors(personId);

      // Step 2: collect all descendants of every ancestor
      function addDescendants(id) {
        if (!id || blood.has(id) || !people[id]) return;
        blood.add(id);
        for (const cid in people) {
          if (people[cid].parent1 === id || people[cid].parent2 === id) {
            addDescendants(cid);
          }
        }
      }
      for (const aid of ancestors) {
        addDescendants(aid);
      }

      return blood;
    }

    // ── Rebuild graph ──
    var lastFitKey = null;

    // The people actually on screen, after the bloodline filter and any
    // collapsed branches.
    function visiblePeople() {
      const bloodSet = (bloodlineMode && bloodlinePersonId) ? getBloodRelatives(bloodlinePersonId) : null;

      const hideSet = new Set();
      function collectDescendants(pid) {
        for (const cid in people) {
          if (hideSet.has(cid)) continue;
          if (people[cid].parent1 === pid || people[cid].parent2 === pid) {
            hideSet.add(cid);
            collectDescendants(cid);
          }
        }
      }
      for (const pid of hiddenChildrenSet) {
        if (people[pid]) collectDescendants(pid);
      }

      const visible = {};
      for (const id in people) {
        if (bloodSet && !bloodSet.has(id)) continue;
        if (hideSet.has(id)) continue;
        visible[id] = people[id];
      }
      return visible;
    }

    function rebuildGraph() {
      const visible = visiblePeople();
      const ids = Object.keys(visible);

      cy.elements().remove();
      if (!ids.length) { lastFitKey = null; return; }

      // 1. people first, so cytoscape can size the boxes from their labels
      for (const id of ids) {
        const p = visible[id];
        const data = {
          id: id,
          label: p.birthYear ? p.name + '\n' + p.birthYear : p.name,
          type: 'person',
          color: '#95a5a6',
          photo: p.photo || 'none',
          hasPhoto: !!p.photo,
        };
        cy.add({ data: data, position: { x: 0, y: 0 } });
      }

      // 2. lay out
      const size = measureNodes(ids);
      const layout = FamilyLayout.compute(visible, { size: function (id) { return size[id]; } });

      cy.startBatch();
      for (const id of ids) {
        const n = cy.getElementById(id);
        const gen = layout.maxLayer - layout.layers[id];   // youngest generation first
        n.data('gen', gen);
        n.data('color', hiddenChildrenSet.has(id) ? '#bdc3c7' : GEN_COLORS[gen % GEN_COLORS.length]);
        n.position(layout.pos[id]);
      }

      // 3. couples get a bar between them; children hang off the middle of it
      for (const u of layout.unions) {
        if (u.parents.length === 2) {
          cy.add({ data: {
            id: 'bar:' + u.id,
            source: u.parents[0],
            target: u.parents[1],
            etype: u.children.length ? 'couple' : 'partner',
          }});
        }
        if (!u.children.length) continue;

        let source = u.parents[0];
        let startY = u.y + size[u.parents[0]].h / 2;   // edges leave a single parent at the bottom
        if (u.parents.length === 2) {
          source = 'j:' + u.id;
          startY = u.y;                                 // the junction sits on the bar
          cy.add({ data: { id: source, type: 'couple' }, position: { x: u.x, y: u.y } });
        }
        for (const c of u.children) {
          cy.add({ data: {
            id: 'kid:' + u.id + '>' + c,
            source: source,
            target: c,
            etype: 'child',
            turn: Math.max(6, u.barY - startY),
          }});
        }
      }
      cy.endBatch();

      // Only reset the viewport when the set of people on screen changed —
      // editing a name shouldn't yank the view around.
      const fitKey = ids.slice().sort().join(',');
      if (fitKey !== lastFitKey) {
        lastFitKey = fitKey;
        cy.fit(undefined, 50);
        if (cy.zoom() > 1.4) { cy.zoom(1.4); cy.center(); }
      }
    }

    // The toolbar runs out of room on a phone, so every label has a short form.
    function setBloodlineLabel(full, short) {
      document.getElementById('bloodlineBtn').innerHTML =
        '<span class="lbl-full">' + full + '</span><span class="lbl-short">' + short + '</span>';
    }

    // ── Add a person, related or not ──────────────────────────────────────
    // The old flow made a stray person and then asked you to find them in the
    // graph and link them, twice over for a child of two parents. Nobody
    // thinks of a relative that way: they are someone's daughter before they
    // are anybody at all. So the relationship comes first and the whole thing
    // is one sheet and one request.

    // How each relation reads from the *new* person's side, plus the writes
    // needed when the other party already exists.
    const RELATIONS = {
      parent:  { title: 'Add a parent',  of: 'parent of',  pick: 'Choose a parent' },
      partner: { title: 'Add a partner', of: 'partner of', pick: 'Choose a partner' },
      child:   { title: 'Add a child',   of: 'child of',   pick: 'Choose a child' },
      sibling: { title: 'Add a sibling', of: 'sibling of', pick: 'Choose a sibling' },
    };

    let relSheet = null;   // { anchorId, relation } — anchorId null for a loose person

    function openAddSheet() {
      relSheet = { anchorId: null, relation: null, fromCard: false };
      renderRelSheet();
    }

    function openRelSheet(relation) {
      if (!selectedPersonId) return;
      saveCurrentEdits();
      relSheet = { anchorId: selectedPersonId, relation: relation, fromCard: true };
      closeDetailKeepSelection();
      renderRelSheet();
    }

    function closeRelSheet() {
      document.getElementById('rel-overlay').classList.remove('open');
      const anchorId = relSheet && relSheet.anchorId;
      relSheet = null;
      // Coming back from a relative sheet, land where you were.
      if (anchorId && people[anchorId]) openDetail(anchorId);
    }

    function renderRelSheet() {
      document.getElementById('relName').value = '';
      document.getElementById('relYear').value = '';
      renderRelContext();
      showRelCreate();
      document.getElementById('rel-overlay').classList.add('open');
      setTimeout(function () { document.getElementById('relName').focus(); }, 60);
    }

    // Title, explanation and whatever the relation implies beyond a name.
    // Split out from renderRelSheet so choosing a relative part-way through
    // does not wipe what has already been typed.
    function renderRelContext() {
      const anchor = relSheet.anchorId ? people[relSheet.anchorId] : null;
      const spec = relSheet.relation ? RELATIONS[relSheet.relation] : null;
      const fixed = !!relSheet.fromCard;

      document.getElementById('relTitle').textContent = spec && fixed ? spec.title : 'Add person';
      document.getElementById('relSub').innerHTML = anchor && spec
        ? 'They will be the ' + spec.of + ' <strong>' + escHtml(anchor.name) + '</strong>.'
        : 'Add them on their own, or say how they are related below.';

      const extra = document.getElementById('relExtra');
      extra.innerHTML = '';

      // Started from the toolbar: offer the relationship as an optional step.
      if (!fixed) {
        if (anchor && spec) {
          extra.innerHTML = '<label class="sheet-label">Related to</label>' +
            '<div class="sheet-note">' + escHtml(spec.of.charAt(0).toUpperCase() + spec.of.slice(1)) +
            ' <strong>' + escHtml(anchor.name) + '</strong>' +
            '<button class="rel-clear" onclick="clearRelChoice()" title="Remove">&times;</button></div>';
        } else {
          extra.innerHTML = '<label class="sheet-label">Related to <span class="opt">— optional</span></label>' +
            '<div class="rel-add-grid">' +
            Object.keys(RELATIONS).map(function (r) {
              return '<button onclick="chooseRelFor(\'' + r + '\')">' +
                escHtml(RELATIONS[r].of.charAt(0).toUpperCase() + RELATIONS[r].of.slice(1)) + '…</button>';
            }).join('') + '</div>';
        }
      }

      if (anchor && relSheet.relation === 'child' && anchor.partner && people[anchor.partner]) {
        extra.innerHTML += '<label class="sheet-check">' +
          '<input type="checkbox" id="relWithPartner" checked>' +
          '<span>Also a child of <strong>' + escHtml(people[anchor.partner].name) + '</strong></span></label>';
      } else if (anchor && relSheet.relation === 'sibling') {
        const names = [anchor.parent1, anchor.parent2]
          .filter(function (p) { return p && people[p]; })
          .map(function (p) { return escHtml(people[p].name); });
        extra.innerHTML += '<div class="sheet-note">Will share ' +
          (names.length > 1 ? 'parents ' : 'parent ') + names.join(' and ') + '.</div>';
      } else if (anchor && relSheet.relation === 'parent' && anchor.parent1 && people[anchor.parent1]) {
        extra.innerHTML += '<div class="sheet-note">Second parent, alongside ' +
          escHtml(people[anchor.parent1].name) + '.</div>';
      }

      document.getElementById('relSwitchBtn').style.display = (fixed && relSheet.relation) ? '' : 'none';
    }

    // Toolbar route: pick the relationship, then who it is to.
    function chooseRelFor(relation) {
      relSheet.relation = relation;
      showRelPicker();
    }

    function clearRelChoice() {
      relSheet.anchorId = null;
      relSheet.relation = null;
      renderRelContext();
    }

    function showRelCreate() {
      document.getElementById('relCreate').style.display = '';
      document.getElementById('relPick').style.display = 'none';
      hideRelErrors();
    }

    function hideRelErrors() {
      document.getElementById('relError').classList.remove('show');
      document.getElementById('relPickError').classList.remove('show');
    }

    function relFail(elId, message) {
      const el = document.getElementById(elId);
      el.textContent = message;
      el.classList.add('show');
    }

    async function confirmRelAdd() {
      if (!relSheet) return;
      const name = document.getElementById('relName').value.trim();
      if (!name) { relFail('relError', 'Give them a name first.'); return; }
      const birthYear = document.getElementById('relYear').value.trim();
      const withPartner = !!(document.getElementById('relWithPartner') || {}).checked;

      const body = { name: name, birthYear: birthYear };
      if (relSheet.relation) {
        body.attach = { relation: relSheet.relation, anchorId: relSheet.anchorId, withPartner: withPartner };
      }

      const btn = document.getElementById('relAddBtn');
      btn.disabled = true;
      btn.textContent = 'Adding…';
      try {
        const res = await fetch('/api/trees/' + currentTreeId + '/people', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) { relFail('relError', data.error || 'Could not add them.'); return; }
        people[data.person.id] = data.person;
        if (data.anchor) people[data.anchor.id] = data.anchor;
        rebuildGraph();
        const newId = data.person.id;
        relSheet = null;
        document.getElementById('rel-overlay').classList.remove('open');
        // Bring them into view behind the card, so closing it shows where they
        // landed rather than leaving you to hunt for them.
        const node = cy.getElementById(newId);
        if (node.length) cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 0.8) }, { duration: 250 });
        // Open the person just made: a birth year or photo is then one tap away.
        openDetail(newId);
      } catch (e) {
        relFail('relError', 'Could not reach the server. Try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Add';
      }
    }

    // ── Linking someone already in the tree ──
    // Searching a list beats hunting for a 12px node on a phone.
    function showRelPicker() {
      document.getElementById('relCreate').style.display = 'none';
      document.getElementById('relPick').style.display = '';
      hideRelErrors();
      const spec = RELATIONS[relSheet.relation];
      document.getElementById('relTitle').textContent = spec.pick;
      document.getElementById('relSub').innerHTML = relSheet.fromCard
        ? 'They will be the ' + spec.of + ' <strong>' + escHtml(people[relSheet.anchorId].name) + '</strong>.'
        : 'The new person will be the ' + spec.of + ' whoever you choose.';
      document.getElementById('relSearch').value = '';
      renderRelPicker();
      setTimeout(function () { document.getElementById('relSearch').focus(); }, 60);
    }

    function backFromPicker() {
      if (!relSheet.fromCard && !relSheet.anchorId) relSheet.relation = null;
      renderRelContext();
      showRelCreate();
    }

    function renderRelPicker() {
      const q = document.getElementById('relSearch').value.trim().toLowerCase();
      const anchorId = relSheet.anchorId;
      const list = Object.values(people)
        .filter(function (p) { return p.id !== anchorId; })
        .filter(function (p) { return !q || p.name.toLowerCase().indexOf(q) !== -1; })
        .sort(function (a, b) { return a.name.localeCompare(b.name); });

      const el = document.getElementById('relList');
      if (!list.length) {
        el.innerHTML = '<div class="pick-empty">Nobody here by that name.</div>';
        return;
      }
      el.innerHTML = list.map(function (p) {
        const avatar = p.photo
          ? '<img class="pick-avatar" src="' + p.photo + '" alt="">'
          : '<span class="pick-avatar">' + escHtml((p.name || '?').charAt(0).toUpperCase()) + '</span>';
        const meta = [p.birthYear, describeRelations(p)].filter(Boolean).join(' · ');
        return '<button class="pick-row" onclick="pickExisting(\'' + p.id + '\')">' + avatar +
          '<span class="pick-name">' + escHtml(p.name) +
          (meta ? '<span>' + escHtml(meta) + '</span>' : '') + '</span></button>';
      }).join('');
    }

    // A line of context so two cousins with the same name can be told apart.
    function describeRelations(p) {
      const bits = [];
      const parents = [p.parent1, p.parent2].filter(function (x) { return x && people[x]; });
      if (parents.length) bits.push('child of ' + parents.map(function (x) { return people[x].name; }).join(' & '));
      if (p.partner && people[p.partner]) bits.push('with ' + people[p.partner].name);
      return bits.join(', ');
    }

    async function pickExisting(otherId) {
      if (!relSheet || !relSheet.relation) return;
      // Toolbar route: nothing exists to link yet, so this just records who
      // the new person will be related to.
      if (!relSheet.fromCard) {
        relSheet.anchorId = otherId;
        renderRelContext();
        showRelCreate();
        setTimeout(function () { document.getElementById('relName').focus(); }, 60);
        return;
      }
      const anchorId = relSheet.anchorId;
      const relation = relSheet.relation;
      const problem = relationProblem(anchorId, relation, otherId);
      if (problem) { relFail('relPickError', problem); return; }

      relSheet = null;
      document.getElementById('rel-overlay').classList.remove('open');
      await applyRelation(anchorId, relation, otherId);
      if (people[anchorId]) openDetail(anchorId);
    }

    // Reasons a link cannot be made, phrased for the person reading them.
    function relationProblem(anchorId, relation, otherId) {
      const anchor = people[anchorId], other = people[otherId];
      if (!anchor || !other) return 'That person is no longer in the tree.';
      if (relation === 'parent') {
        if (anchor.parent1 === otherId || anchor.parent2 === otherId) return other.name + ' is already a parent of ' + anchor.name + '.';
        if (anchor.parent1 && anchor.parent2) return anchor.name + ' already has two parents. Remove one first.';
        if (isAncestorOf(anchorId, otherId)) return other.name + ' already descends from ' + anchor.name + ', so that would loop back on itself.';
      }
      if (relation === 'child') {
        if (other.parent1 === anchorId || other.parent2 === anchorId) return other.name + ' is already a child of ' + anchor.name + '.';
        if (other.parent1 && other.parent2) return other.name + ' already has two parents. Remove one first.';
        if (isAncestorOf(otherId, anchorId)) return anchor.name + ' already descends from ' + other.name + ', so that would loop back on itself.';
      }
      if (relation === 'partner') {
        if (other.partner && other.partner !== anchorId) return other.name + ' already has a partner. Remove it first.';
        if (anchor.partner && anchor.partner !== otherId) return anchor.name + ' already has a partner. Remove it first.';
      }
      if (relation === 'sibling') {
        if (!anchor.parent1 && !anchor.parent2) return 'Give ' + anchor.name + ' a parent first — a sibling is someone who shares them.';
        if (other.parent1 || other.parent2) return other.name + ' already has parents recorded. Remove them first.';
      }
      return null;
    }

    // Walking up from `descendantId`, do we meet `id`?
    function isAncestorOf(id, descendantId) {
      const stack = [descendantId], seen = {};
      while (stack.length) {
        const cur = stack.pop();
        if (cur === id) return true;
        if (seen[cur]) continue;
        seen[cur] = 1;
        const p = people[cur];
        if (!p) continue;
        if (p.parent1) stack.push(p.parent1);
        if (p.parent2) stack.push(p.parent2);
      }
      return false;
    }

    async function applyRelation(anchorId, relation, otherId) {
      const anchor = people[anchorId], other = people[otherId];
      const writes = [];

      if (relation === 'parent' || relation === 'child') {
        // Same edit either way round: the child carries the link.
        const child = relation === 'parent' ? anchor : other;
        const parentId = relation === 'parent' ? otherId : anchorId;
        const slot = child.parent1 ? 'parent2' : 'parent1';
        child[slot] = parentId;
        writes.push([child.id, slotUpdate(slot, parentId)]);
      } else if (relation === 'partner') {
        if (anchor.partner && anchor.partner !== otherId && people[anchor.partner]) {
          people[anchor.partner].partner = null;
          writes.push([anchor.partner, { partner: null }]);
        }
        anchor.partner = otherId;
        other.partner = anchorId;
        writes.push([anchorId, { partner: otherId }], [otherId, { partner: anchorId }]);
      } else if (relation === 'sibling') {
        other.parent1 = anchor.parent1;
        other.parent2 = anchor.parent2;
        writes.push([otherId, { parent1: anchor.parent1, parent2: anchor.parent2 }]);
      }

      rebuildGraph();
      await Promise.all(writes.map(function (w) {
        return fetch('/api/trees/' + currentTreeId + '/people/' + w[0], {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(w[1])
        });
      }));
    }

    function slotUpdate(slot, value) {
      const o = {};
      o[slot] = value;
      return o;
    }

    // Escape hatch: the graph is still the nicest picker on a big screen.
    function pickFromGraph() {
      if (!relSheet) return;
      const anchorId = relSheet.anchorId, relation = relSheet.relation;
      relSheet = null;
      document.getElementById('rel-overlay').classList.remove('open');
      graphPick = { anchorId: anchorId, relation: relation };
      selectedPersonId = anchorId;
      document.getElementById('graphPickText').textContent = 'Tap the ' + RELATIONS[relation].of.replace(' of', '') + ' of ' + people[anchorId].name + '.';
      document.getElementById('parent-banner').classList.add('open');
      cy.getElementById(anchorId).addClass('highlighted');
    }

    function exitGraphPick() {
      if (graphPick) cy.getElementById(graphPick.anchorId).removeClass('highlighted');
      graphPick = null;
      document.getElementById('parent-banner').classList.remove('open');
    }

    async function graphPickTarget(targetId) {
      const anchorId = graphPick.anchorId, relation = graphPick.relation;
      if (targetId === anchorId) return;
      const problem = relationProblem(anchorId, relation, targetId);
      exitGraphPick();
      if (problem) { alert(problem); return; }
      await applyRelation(anchorId, relation, targetId);
      openDetail(anchorId);
    }

    document.getElementById('relName').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') confirmRelAdd();
      if (e.key === 'Escape') closeRelSheet();
    });
    document.getElementById('relYear').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') confirmRelAdd();
      if (e.key === 'Escape') closeRelSheet();
    });

    // ── Detail Card (inline editable) ──
    function openDetail(id) {
      const person = people[id];
      if (!person) return;
      selectedPersonId = id;
      document.getElementById('editId').value = id;
      document.getElementById('editName').value = person.name;
      document.getElementById('editBirthYear').value = person.birthYear;
      document.getElementById('editNotes').value = person.notes;

      const photoEl = document.getElementById('detailPhoto');
      const placeholder = document.getElementById('detailPhotoPlaceholder');
      const photoBtn = document.getElementById('detailPhotoBtn');
      const existingImg = photoEl.querySelector('img');
      if (existingImg) existingImg.remove();

      if (person.photo) {
        placeholder.style.display = 'none';
        const img = document.createElement('img');
        img.src = person.photo;
        photoEl.insertBefore(img, photoBtn);
        photoBtn.textContent = 'Change Photo';
      } else {
        placeholder.style.display = '';
        photoBtn.textContent = 'Add Photo';
      }

      const partnerDiv = document.getElementById('detailPartner');
      if (person.partner && people[person.partner]) {
        partnerDiv.innerHTML = '<label>Partner</label><p>' +
          relChip(person.partner, people[person.partner].name, 'removePartner()', 'Remove partner') + '</p>';
      } else {
        partnerDiv.innerHTML = '<label>Partner</label><p style="color:#999">None set</p>';
      }

      const parentsDiv = document.getElementById('detailParents');
      const parentNames = [];
      if (person.parent1 && people[person.parent1]) parentNames.push({ id: person.parent1, name: people[person.parent1].name });
      if (person.parent2 && people[person.parent2]) parentNames.push({ id: person.parent2, name: people[person.parent2].name });
      if (parentNames.length) {
        parentsDiv.innerHTML = '<label>Parents</label><p>' +
          parentNames.map(p => relChip(p.id, p.name, "removeParentLink('" + id + "','" + p.id + "')", 'Remove parent')).join('') + '</p>';
      } else {
        parentsDiv.innerHTML = '<label>Parents</label><p style="color:#999">None set</p>';
      }

      const childrenDiv = document.getElementById('detailChildren');
      const children = Object.values(people).filter(p => p.parent1 === id || p.parent2 === id);
      if (children.length) {
        childrenDiv.innerHTML = '<label>Children</label><p>' +
          children.map(c => relChip(c.id, c.name, "removeParentLink('" + c.id + "','" + id + "')", 'Remove this parent link')).join('') + '</p>';
      } else {
        childrenDiv.innerHTML = '';
      }

      const btnHide = document.getElementById('btnHideChildren');
      if (children.length === 0) {
        btnHide.style.display = 'none';
      } else {
        btnHide.style.display = '';
        btnHide.textContent = hiddenChildrenSet.has(id) ? 'Show Children' : 'Hide Children';
      }

      // Grey out what this person cannot have, rather than letting someone
      // fill in a whole form and then be told no.
      const hasBothParents = !!(person.parent1 && person.parent2);
      const btnAddParent = document.getElementById('btnAddParent');
      btnAddParent.disabled = hasBothParents;
      btnAddParent.title = hasBothParents ? 'Already has two parents' : '';
      const btnAddPartner = document.getElementById('btnAddPartner');
      btnAddPartner.disabled = !!person.partner;
      btnAddPartner.title = person.partner ? 'Already has a partner' : '';
      const btnAddSibling = document.getElementById('btnAddSibling');
      const hasAnyParent = !!(person.parent1 || person.parent2);
      btnAddSibling.disabled = !hasAnyParent;
      btnAddSibling.title = hasAnyParent ? '' : 'Add a parent first — a sibling shares one';

      document.getElementById('detail-overlay').classList.add('open');
    }

    async function saveCurrentEdits() {
      const id = document.getElementById('editId').value;
      const person = people[id];
      if (!person) return;
      const newName = document.getElementById('editName').value.trim() || 'Unnamed';
      const newYear = document.getElementById('editBirthYear').value.trim();
      const newNotes = document.getElementById('editNotes').value;
      const changed = person.name !== newName || person.birthYear !== newYear || person.notes !== newNotes;
      if (!changed) return;
      person.name = newName;
      person.birthYear = newYear;
      person.notes = newNotes;
      rebuildGraph();
      await fetch('/api/trees/' + currentTreeId + '/people/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: newName, birthYear: newYear, notes: newNotes })
      });
    }

    async function saveAndCloseDetail() {
      await saveCurrentEdits();
      document.getElementById('detail-overlay').classList.remove('open');
      selectedPersonId = null;
    }

    async function saveAndOpenDetail(id) {
      await saveCurrentEdits();
      openDetail(id);
    }

    function closeDetail() {
      document.getElementById('detail-overlay').classList.remove('open');
      selectedPersonId = null;
    }

    // Stepping from a card into a sheet about that same person: the card goes
    // away but they are still who we are talking about.
    function closeDetailKeepSelection() {
      document.getElementById('detail-overlay').classList.remove('open');
    }

    // A related person: tap the name to walk there, tap the × to break the link.
    function relChip(personId, name, removeCall, title) {
      return '<span class="rel-chip">' +
        '<span class="parent-link" onclick="saveAndOpenDetail(\'' + personId + '\')">' + escHtml(name) + '</span>' +
        '<button class="rel-remove" title="' + title + '" onclick="' + removeCall + '">&times;</button>' +
        '</span>';
    }

    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // ── Photo handling ──
    function handlePhoto(event) {
      const file = event.target.files[0];
      if (!file || !selectedPersonId) return;
      const personId = selectedPersonId;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = async function() {
          const canvas = document.createElement('canvas');
          const maxSize = 200;
          let w = img.width, h = img.height;
          if (w > h) { h = h * maxSize / w; w = maxSize; }
          else { w = w * maxSize / h; h = maxSize; }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const photo = canvas.toDataURL('image/jpeg', 0.7);
          people[personId].photo = photo;
          rebuildGraph();
          openDetail(personId);
          await fetch('/api/trees/' + currentTreeId + '/people/' + personId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ photo })
          });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    // ── Delete from detail ──
    async function deleteFromDetail() {
      const id = selectedPersonId;
      if (!id || !people[id]) return;
      if (!confirm('Delete ' + people[id].name + '?')) return;
      for (const pid in people) {
        if (people[pid].parent1 === id) people[pid].parent1 = null;
        if (people[pid].parent2 === id) people[pid].parent2 = null;
        if (people[pid].partner === id) people[pid].partner = null;
      }
      delete people[id];
      hiddenChildrenSet.delete(id);
      closeDetail();
      if (bloodlinePersonId === id) clearBloodlineMode();
      rebuildGraph();
      await fetch('/api/trees/' + currentTreeId + '/people/' + id, { method: 'DELETE' });
    }

    // ── Hide Children Toggle ──
    function toggleHideChildren() {
      const id = selectedPersonId;
      if (!id) return;
      if (hiddenChildrenSet.has(id)) {
        hiddenChildrenSet.delete(id);
      } else {
        hiddenChildrenSet.add(id);
      }
      document.getElementById('detail-overlay').classList.remove('open');
      selectedPersonId = null;
      rebuildGraph();
    }

    // Breaking a parent/child link is the same edit seen from either end, so
    // the chips in both the Parents and the Children list come through here.
    async function removeParentLink(childId, parentId) {
      await saveCurrentEdits();
      const child = people[childId];
      if (!child) return;

      const update = {};
      if (child.parent1 === parentId) { child.parent1 = null; update.parent1 = null; }
      else if (child.parent2 === parentId) { child.parent2 = null; update.parent2 = null; }
      else return;

      rebuildGraph();
      if (selectedPersonId) openDetail(selectedPersonId);
      await fetch('/api/trees/' + currentTreeId + '/people/' + childId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(update)
      });
    }

    async function removePartner() {
      await saveCurrentEdits();
      await removePartnerLink(selectedPersonId);
    }

    async function removePartnerLink(id, opts) {
      const person = people[id];
      if (!person || !person.partner) return;
      const partnerId = person.partner;
      const partner = people[partnerId];

      person.partner = null;
      if (partner) partner.partner = null;

      if (!opts || opts.redraw !== false) {
        rebuildGraph();
        if (selectedPersonId) openDetail(selectedPersonId);
      }
      await Promise.all([
        fetch('/api/trees/' + currentTreeId + '/people/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ partner: null })
        }),
        partner ? fetch('/api/trees/' + currentTreeId + '/people/' + partnerId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ partner: null })
        }) : Promise.resolve()
      ]);
    }

    // ── Bloodline filter mode ──
    function toggleBloodlineMode() {
      if (bloodlineMode) {
        clearBloodlineMode();
      } else {
        bloodlineMode = true;
        bloodlinePersonId = null;
        setBloodlineLabel('Show All', 'Show All');
        document.getElementById('bloodline-banner-text').textContent = 'Click a person to show their bloodline.';
        document.getElementById('bloodline-banner').classList.add('open');
      }
    }

    function applyBloodlineFilter(id) {
      if (!people[id]) return;
      bloodlinePersonId = id;
      document.getElementById('bloodline-banner-text').innerHTML = 'Showing bloodline for <b>' + escHtml(people[id].name) + '</b>.';
      rebuildGraph();
    }

    function clearBloodlineMode() {
      bloodlineMode = false;
      bloodlinePersonId = null;
      setBloodlineLabel('Show Bloodline', 'Bloodline');
      document.getElementById('bloodline-banner').classList.remove('open');
      rebuildGraph();
    }

    // ── WebSocket for real-time sync ──
    function connectWS() {
      if (ws) { ws.close(); ws = null; }
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(proto + '//' + location.host + '/ws');

      ws.onopen = function() {
        ws.send(JSON.stringify({ type: 'join', treeId: currentTreeId }));
      };

      ws.onmessage = function(event) {
        const msg = JSON.parse(event.data);
        if (msg.type === 'state:full') {
          nextId = msg.data.nextId;
          people = msg.data.people;
          rebuildGraph();
        } else if (msg.type === 'person:created') {
          people[msg.person.id] = msg.person;
          rebuildGraph();
        } else if (msg.type === 'person:updated') {
          people[msg.person.id] = msg.person;
          rebuildGraph();
          if (selectedPersonId === msg.person.id) openDetail(msg.person.id);
        } else if (msg.type === 'person:deleted') {
          delete people[msg.id];
          for (const pid in people) {
            if (people[pid].partner === msg.id) people[pid].partner = null;
          }
          msg.affectedChildren.forEach(function(cid) {
            if (people[cid]) {
              if (people[cid].parent1 === msg.id) people[cid].parent1 = null;
              if (people[cid].parent2 === msg.id) people[cid].parent2 = null;
            }
          });
          if (selectedPersonId === msg.id) closeDetail();
          if (bloodlinePersonId === msg.id) clearBloodlineMode();
          rebuildGraph();
        }
      };

      ws.onclose = function() {
        if (currentTreeId) setTimeout(connectWS, 2000);
      };
    }

    // ── Init: check URL for tree code, then localStorage, else show landing ──
    (async function init() {
      // Check URL first (e.g. /tree/ABC123)
      const urlMatch = location.pathname.match(/^\/tree\/([A-Fa-f0-9]{6})$/);
      if (urlMatch) {
        const res = await fetch('/api/trees/join/' + urlMatch[1]);
        if (res.ok) {
          const tree = await res.json();
          enterTree(tree.id, tree.code);
          return;
        }
      }

      // Fall back to localStorage
      const lastId = localStorage.getItem('lastTreeId');
      const lastCode = localStorage.getItem('lastTreeCode');
      if (lastId && lastCode) {
        const res = await fetch('/api/trees/join/' + lastCode);
        if (res.ok) {
          enterTree(lastId, lastCode);
          return;
        }
      }
      showLanding();
    })();
  </script>
</body>
